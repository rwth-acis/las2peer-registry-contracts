name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: forge install --no-git foundry-rs/forge-std@v1.17.0
      - run: forge fmt --check || true
      - run: forge test -vv
      - name: Deploy to a local chain and export the registry config
        run: |
          anvil --chain-id 456719 --silent &
          ./scripts/deploy.sh
      - name: Docker image builds
        run: docker build -t las2peer-contracts .

[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# deploy script writes the las2peer registry config
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 120

[lint]
lint_on_build = false
